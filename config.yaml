server:
  host: 0.0.0.0
  port: 8000
  tls: false
  certfile: null
  keyfile: null
storage:
  database: data/music.sqlite3
  music: data/music
security:
  cookie_secure: false
upload:
  max_mb: 200

# Set the exact public HTTPS origin before enabling passkeys behind Nginx.
# For local development only: rp_id: localhost, origin: http://localhost:8000
passkeys:
  enabled: false
  rp_id: ""
  origin: ""

# HLS uses a single background encoder; cached segments are shared between sessions.
hls:
  enabled: true
  ffmpeg: ffmpeg
  cache: data/hls-cache
  cache_mb: 2048
  idle_seconds: 3600
  max_sessions: 32
  ahead_seconds: 300
